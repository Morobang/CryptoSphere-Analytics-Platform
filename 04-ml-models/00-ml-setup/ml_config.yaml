# Machine Learning Configuration for CryptoSphere Analytics Platform

# Model Training Configuration
model_training:
  # Default models to train
  default_models:
    - "linear_regression"
    - "random_forest" 
    - "xgboost"
    - "lightgbm"
  
  # Cross-validation settings
  cross_validation:
    folds: 5
    scoring: "neg_mean_squared_error"
    
  # Train/validation/test split ratios
  data_split:
    test_size: 0.2
    validation_size: 0.1
    time_based_split: true
    
  # Early stopping
  early_stopping:
    enabled: true
    patience: 10
    monitor: "val_loss"

# Feature Engineering Configuration
feature_engineering:
  # Technical indicators to create
  technical_indicators:
    - "sma"      # Simple Moving Averages
    - "ema"      # Exponential Moving Averages  
    - "rsi"      # Relative Strength Index
    - "macd"     # MACD
    - "bollinger_bands"
    - "stochastic"
    - "williams_r"
    - "atr"      # Average True Range
    - "cci"      # Commodity Channel Index
    - "mfi"      # Money Flow Index
    
  # Moving average periods
  ma_periods: [7, 14, 30, 90]
  
  # Price change periods
  price_change_periods: [1, 3, 7, 14, 30]
  
  # Lag features
  lag_periods: [1, 2, 3, 7, 14]
  
  # Rolling window periods for statistics
  rolling_windows: [7, 14, 30]
  
  # Target prediction horizons (days)
  prediction_horizons: [1, 3, 7]

# Data Preprocessing Configuration  
data_preprocessing:
  # Scaling method
  scaling_method: "standard"  # Options: standard, minmax, robust, power
  
  # Missing value handling
  missing_values:
    strategy: "forward_fill"  # Options: forward_fill, interpolate, zero, mean, median
    
  # Outlier handling
  outlier_detection:
    enabled: true
    method: "iqr"  # Options: iqr, z_score, isolation_forest
    threshold: 3.0
    
  # Feature selection
  feature_selection:
    enabled: true
    method: "mutual_info"  # Options: mutual_info, f_regression, rfe
    n_features: 50

# Hyperparameter Tuning Configuration
hyperparameter_tuning:
  # Tuning method
  method: "random_search"  # Options: grid_search, random_search, optuna
  
  # Number of iterations for random search/optuna
  n_iterations: 100
  
  # Cross-validation for tuning
  cv_folds: 3
  
  # Parallel processing
  n_jobs: -1

# Model Evaluation Configuration
model_evaluation:
  # Primary evaluation metrics
  primary_metrics:
    - "rmse"
    - "mae" 
    - "r2_score"
    - "directional_accuracy"
    
  # Trading evaluation metrics
  trading_metrics:
    - "sharpe_ratio"
    - "max_drawdown"
    - "hit_rate"
    - "total_return"
    
  # Visualization settings
  visualizations:
    enabled: true
    save_plots: true
    plot_format: "png"
    dpi: 300

# Model Persistence Configuration
model_persistence:
  # Model storage format
  storage_format: "pickle"  # Options: pickle, joblib, mlflow
  
  # Model versioning
  versioning:
    enabled: true
    auto_increment: true
    
  # Model registry settings
  registry:
    storage_path: "models/"
    metadata_tracking: true
    performance_tracking: true

# Prediction Pipeline Configuration
prediction_pipeline:
  # Batch prediction settings
  batch_size: 1000
  
  # Real-time prediction settings
  real_time:
    enabled: true
    update_frequency: 300  # seconds
    
  # Prediction confidence
  confidence_intervals:
    enabled: true
    confidence_level: 0.95

# Performance Monitoring
monitoring:
  # Model drift detection
  drift_detection:
    enabled: true
    method: "psi"  # Population Stability Index
    threshold: 0.2
    
  # Performance alerts
  alerts:
    enabled: true
    rmse_threshold: 0.1
    accuracy_threshold: 0.6
    
  # Logging
  logging:
    level: "INFO"
    file: "ml_models.log"
    max_size: "10MB"
    backup_count: 3

# Resource Configuration
resources:
  # Memory limits
  max_memory_gb: 8
  
  # CPU limits  
  max_cpu_cores: 4
  
  # GPU settings
  gpu:
    enabled: false
    device: "cuda:0"
    
  # Parallel processing
  parallel_processing:
    enabled: true
    n_jobs: -1

# Cryptocurrency Specific Settings
crypto_settings:
  # Target cryptocurrencies
  target_cryptos:
    - "BTC"
    - "ETH" 
    - "ADA"
    - "DOT"
    - "BNB"
    - "XRP"
    - "SOL"
    - "DOGE"
    - "MATIC"
    - "AVAX"
    
  # Market data requirements
  min_data_points: 100
  max_data_age_days: 365
  
  # Price prediction specific
  price_prediction:
    min_price_change: 0.001  # Minimum meaningful price change (0.1%)
    volatility_window: 30    # Days for volatility calculation
    
  # Risk management
  risk_management:
    max_position_size: 0.1   # 10% maximum position
    stop_loss: 0.05          # 5% stop loss
    take_profit: 0.1         # 10% take profit